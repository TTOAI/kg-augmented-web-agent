# InfoType 카탈로그
# 스키마: docs/kg_design/02_open_questions.md §3-4 (InfoType 범위 결정)
# granularity: β (도메인 명사구 수준), InfoType ↔ StatePattern 1:N
#
# 구축 파이프라인 (3단계 hybrid, docs/kg_design/07 §14):
#   1. Playwright crawl → source=crawl / trust=verified
#   2. LLM derivation  → source=llm   / trust=inferred
#   3. Manual verify   → source=manual/ trust=declared
# 각 항목은 `source` 필드로 어느 layer의 기여인지 표기.
#
# 2026-04-16: M4-B derivation (gpt-5.4) 결과 46 InfoType이 도출됨. 이전 manual
# skeleton 항목은 평가 task에 편향된 선택이어서 삭제(hindsight bias 차단). 이 파일은
# 비워 두고 모든 InfoType은 derived_kg.json 또는 frozen_kg snapshot에서 관리한다.

version: 2
site: gitlab

infotypes: []

# ---------------------------------------------------------------
# Condition 평가 규칙 — realizes 엣지의 condition 필드 해석
# ---------------------------------------------------------------
condition_evaluators:
  default: "no optional_bindings supplied"
  has_filter: "at least one of optional_bindings is non-empty"

# ---------------------------------------------------------------
# 메타
# ---------------------------------------------------------------
source: manual
trust_label_default: declared
last_manual_verification: "2026-04-16"
construction_status: in_progress
