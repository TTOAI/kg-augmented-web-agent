[project]
name = "sitekg-agent"
version = "0.1.0"
description = "Site-adaptive web agent with automated Knowledge Graph construction and retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.55.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
sitekg-agent = "sitekg_agent.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitekg_agent"]
