[project]
name = "site-adaptive-webagent"
version = "0.1.0"
description = "Benchmark-adaptive web agent project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.55.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["site_adaptive_webagent"]
